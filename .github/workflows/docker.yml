name: Docker

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish, for example v0.3.49"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/u188/octopus
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  docker:
    name: Build and publish Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y zip unzip

      - name: Build release binaries
        run: bash scripts/build.sh release

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Debian image metadata
        id: meta-debian
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.title=Octopus
            org.opencontainers.image.description=Custom LLM gateway for site-synced API routing
            org.opencontainers.image.source=https://github.com/U188/octopus
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}

      - name: Build and push Debian image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./scripts/dockerfiles/Dockerfile.debian
          platforms: linux/amd64,linux/386,linux/arm64,linux/arm/v7
          push: true
          pull: true
          tags: ${{ steps.meta-debian.outputs.tags }}
          labels: ${{ steps.meta-debian.outputs.labels }}

      - name: Generate Alpine image metadata
        id: meta-alpine
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest-alpine
            type=raw,value=${{ env.RELEASE_TAG }}-alpine
          labels: |
            org.opencontainers.image.title=Octopus
            org.opencontainers.image.description=Custom LLM gateway for site-synced API routing
            org.opencontainers.image.source=https://github.com/U188/octopus
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}-alpine

      - name: Build and push Alpine image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./scripts/dockerfiles/Dockerfile.alpine
          platforms: linux/amd64,linux/386,linux/arm64,linux/arm/v7
          push: true
          pull: true
          tags: ${{ steps.meta-alpine.outputs.tags }}
          labels: ${{ steps.meta-alpine.outputs.labels }}
